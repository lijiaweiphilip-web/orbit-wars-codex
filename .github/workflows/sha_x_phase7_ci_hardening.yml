name: SHA-X Phase7 CI Hardening

on:
  push:
    branches:
      - phase7-shax-ci-hardening
      - phase7-shax-ci-hardening-*

jobs:
  sha-x-phase7-ci-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile SHA-X scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile orbit_wars_sha_x1_real_label_v1/scripts/*.py
          python -m py_compile orbit_wars_sha_x_github_cpu_sync_v1/scripts/*.py

      - name: Run phase7 CPU mock tests
        shell: bash
        run: |
          set -euo pipefail
          python orbit_wars_sha_x_github_cpu_sync_v1/scripts/phase7_cpu_mock_tests.py \
            --repo-root . \
            --output-dir experiments/sha_x_phase7_ci_hardening \
            --artifact sha_x_phase7_ci_hardening_artifacts_20260611.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha_x_phase7_ci_hardening_artifacts_20260611.zip
          path: experiments/sha_x_phase7_ci_hardening/sha_x_phase7_ci_hardening_artifacts_20260611.zip
          if-no-files-found: error
